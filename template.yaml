AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RescueRoute Chennai - A*, RF traffic, SNS alerts, WebSockets, SageMaker-ready, Location
Parameters:
  EnableLocation:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable chargeable Amazon Location maps, places and real-road routing
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional email subscribed to SNS mission alerts (leave blank to skip)
  EnableCustomMetrics:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable optional chargeable CloudWatch custom metrics and dispatch alarm
Conditions:
  LocationEnabled: !Equals [!Ref EnableLocation, 'true']
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  CustomMetricsEnabled: !Equals [!Ref EnableCustomMetrics, 'true']
Globals:
  Function:
    Tracing: PassThrough
    Timeout: 29
    Runtime: python3.12
    MemorySize: 512
Resources:
  Operators:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolTags:
        Project: RescueRoute
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
  OperatorClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref Operators
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
  DispatchTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: false
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: RescueRoute Chennai mission alerts
      TopicName: !Sub '${AWS::StackName}-mission-alerts'
  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${Distribution.DomainName}'
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
      Auth:
        DefaultAuthorizer: OperatorAuth
        Authorizers:
          OperatorAuth:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${Operators}'
              audience:
                - !Ref OperatorClient
  RealtimeApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-realtime'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.action'
  RealtimeConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RealtimeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Backend.Arn}/invocations'
  RealtimeDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RealtimeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Backend.Arn}/invocations'
  RealtimeDefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RealtimeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Backend.Arn}/invocations'
  RealtimeConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RealtimeApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${RealtimeConnectIntegration}'
  RealtimeDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RealtimeApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${RealtimeDisconnectIntegration}'
  RealtimeDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RealtimeApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub 'integrations/${RealtimeDefaultIntegration}'
  RealtimeStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref RealtimeApi
      StageName: prod
      AutoDeploy: true
  BackendInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Backend
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RealtimeApi}/*'
  Backend:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handler
      Runtime: python3.12
      MemorySize: 1024
      Timeout: 29
      Tracing: PassThrough
      Environment:
        Variables:
          TABLE_NAME: !Ref DispatchTable
          REPORT_BUCKET: !Ref ReportBucket
          MODEL_BUCKET: !Ref ReportBucket
          ENABLE_LOCATION: !Ref EnableLocation
          ENABLE_CUSTOM_METRICS: !Ref EnableCustomMetrics
          ALERT_TOPIC_ARN: !Ref AlertTopic
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          WEBSOCKET_URL: !Sub 'wss://${RealtimeApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
          WEBSOCKET_CALLBACK_URL: !Sub 'https://${RealtimeApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
      Policies:
        - AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt DispatchTable.Arn
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:Scan]
              Resource: !GetAtt ConnectionsTable.Arn
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource:
                - !Sub '${ReportBucket.Arn}/reports/*'
                - !Sub '${ReportBucket.Arn}/training/*'
                - !Sub '${ReportBucket.Arn}/city/*'
            - Effect: Allow
              Action: [sns:Publish]
              Resource: !Ref AlertTopic
            - Effect: Allow
              Action: [execute-api:ManageConnections]
              Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RealtimeApi}/prod/POST/@connections/*'
            - Effect: Allow
              Action: [geo-routes:CalculateRoutes, geo-routes:CalculateRouteMatrix]
              Resource: !Sub 'arn:${AWS::Partition}:geo-routes:${AWS::Region}::provider/default'
            - Effect: Allow
              Action: [geo-places:SearchText, geo-places:GetPlace]
              Resource: !Sub 'arn:${AWS::Partition}:geo-places:${AWS::Region}::provider/default'
      Events:
        State:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/state, Method: GET}
        Dataset:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/dataset, Method: GET}
        Plan:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/plan, Method: POST}
        Analyze:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/analyze, Method: POST}
        Benchmark:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/benchmark, Method: POST}
        Dispatch:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/dispatch, Method: POST}
        Advance:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/advance, Method: POST}
        Complete:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/complete, Method: POST}
        Settings:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/settings, Method: POST}
        Road:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/road, Method: POST}
        Hospital:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/hospital, Method: POST}
        Gps:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/gps, Method: POST}
        Reset:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/reset, Method: POST}
        Export:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/export, Method: POST}
        LivePlan:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/live-plan, Method: POST}
        StreetPlan:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/street-plan, Method: POST}
        Reference:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/reference-route, Method: POST}
        Places:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/places, Method: POST}
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Backend}'
      RetentionInDays: 14
  SageMakerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RescueRouteTrainingData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - !GetAtt ReportBucket.Arn
                  - !Sub '${ReportBucket.Arn}/*'
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, cloudwatch:PutMetricData]
                Resource: '*'
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: '*'
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-frontend'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - Key: Project
          Value: RescueRoute
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccess
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
          MinTTL: 0
          DefaultTTL: 300
          MaxTTL: 3600
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
  FrontendPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  ReportBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  DispatchErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CustomMetricsEnabled
    Properties:
      AlarmDescription: Repeated dispatch errors in RescueRoute; inspect logs and constraints
      Namespace: RescueRoute
      MetricName: RequestError
      Dimensions:
        - Name: Operation
          Value: /api/dispatch
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
  MapKey:
    Type: AWS::Location::APIKey
    Condition: LocationEnabled
    Properties:
      KeyName: !Sub '${AWS::StackName}-map-browser'
      Description: Browser map-only key restricted to this CloudFront website
      NoExpiry: true
      ForceDelete: true
      Restrictions:
        AllowActions: ['geo-maps:*']
        AllowResources:
          - !Sub 'arn:${AWS::Partition}:geo-maps:${AWS::Region}::provider/default'
        AllowReferers:
          - !Sub 'https://${Distribution.DomainName}/*'
Outputs:
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  WebSocketUrl:
    Value: !Sub 'wss://${RealtimeApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  WebsiteUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  FrontendBucket:
    Value: !Ref FrontendBucket
  DistributionId:
    Value: !Ref Distribution
  UserPoolId:
    Value: !Ref Operators
  ClientId:
    Value: !Ref OperatorClient
  ReportBucket:
    Value: !Ref ReportBucket
  AlertTopicArn:
    Value: !Ref AlertTopic
  SageMakerRoleArn:
    Value: !GetAtt SageMakerRole.Arn
  LocationEnabled:
    Value: !Ref EnableLocation
  MapKeyName:
    Condition: LocationEnabled
    Value: !Ref MapKey
